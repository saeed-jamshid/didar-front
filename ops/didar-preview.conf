# Temporary read-only IP preview. No main-domain/CDN/TLS changes.
server {
    listen 8086;
    server_name _;

    location = /admin { return 404; }
    location /admin/ { return 404; }
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8092;
        # Existing production ALLOWED_HOSTS unchanged; client rebases API URLs.
        proxy_set_header Host didarplace.ir;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /static/ {
        limit_except GET { deny all; }
        alias /opt/didar/back/shared/staticfiles/;
    }
    location ^~ /media/ {
        limit_except GET { deny all; }
        alias /opt/didar/back/shared/media/;
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
